name: Build rdk-wifi-halif Component in Native Environment for Coverity

on:
  push:
    branches: [ main, 'release/**', develop ]
  pull_request:
    branches: [ main, 'release/**', topic/RDK*, develop ]
  workflow_dispatch:

concurrency:
  group: coverity-xb-${{ github.ref }}
  cancel-in-progress: false   # don't kill an in-flight submission

permissions:
  contents: read

jobs:
  build-rdk-wifi-halif:
    name: Build rdk-wifi-halif component in github rdkcentral for Coverity analysis
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rdkcentral/docker-rdk-ci:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Native build for Coverity
      run: |
        # Trust the workspace
        git config --global --add safe.directory '*'
        # Pull the latest changes for the native build system
        git submodule update --init --recursive

        chmod +x build_tools_workflows/cov_docker_script/setup_dependencies.sh
        ./build_tools_workflows/cov_docker_script/setup_dependencies.sh ./cov_docker_script/native-component_config.json
        # Build component
        chmod +x build_tools_workflows/cov_docker_script/build_native.sh
        ./build_tools_workflows/cov_docker_script/build_native.sh ./cov_docker_script/native-component_config.json

    env:
      GITHUB_TOKEN: ${{ secrets.RDKCM_RDKE }}
